# CQC compliance knowledge base — a self-contained Next.js app grown over four sequential
# slices sharing one workspace: foundation (data + query core + tests) → JSON API → explorer
# UI → policy gap analysis. No Supabase, no host services; it runs entirely inside the micro-VM.
name: cqc

# Deterministic invariants checked (in a container) after every GENERATE, before the Evaluator
# is ever spent. `build` doubles as the compile gate AND leaves .next in the shared workspace
# for the app container to serve. Both must hold for the whole programme, so keep them to
# things every slice preserves (the query core and a clean build).
asserts:
  - label: build
    command: npm install --no-audit --no-fund && npm run build
  - label: kb-unit-tests
    command: npm run test:kb

# Booted for evaluation from slice 1 onward (the home page answers HTTP even before the API
# exists). Bind 0.0.0.0 so the Evaluator's sibling container can reach it by container IP.
apps:
  - label: web
    command: npm run start -- -p 3000 -H 0.0.0.0
    port: 3000

specs: # delivered strictly in order; each builds on the shared workspace
  - cqc-foundation.md
  - cqc-api.md
  - cqc-explorer-ui.md
  - cqc-gap-analysis.md
