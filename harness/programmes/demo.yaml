# Demo programme — two trivial sequential slices to smoke-test the harness end to end.
name: demo

# Deterministic checks run after every GENERATE; a non-zero exit loops back to the
# Generator as a finding without spending the Evaluator.
asserts:
  - label: hello-runs
    command: test -f hello.py && python3 hello.py

# No `apps:` — the harness always boots the workspace's Next dev server on 3000, which is
# what the nextjs MCP server attaches to. `apps:` is only for an extra process on top.

specs: # basenames under specs/, delivered strictly in order
  - hello.md
  - goodbye.md
