# NOC incident desk — a multi-tenant internal tool grown over three sequential slices on one
# branch: foundation (auth + schema + RLS + list) → kanban board → assignment and filtering.
#
# Its hardest correctness property — a team can never see another team's incidents — is invisible
# to a compiler, a linter and a read of the diff. It is decided by the isolation suite below and
# by the Evaluator driving two authenticated browser sessions.
name: incident-desk

# Deterministic checks after every GENERATE: anything caught here loops back to the Generator
# with a concrete error instead of costing an Evaluator run. The isolation suite is written by the
# Generator itself (see the specs) so it cannot drift from the schema it chose.
asserts:
  - label: build
    command: npm run build

  - label: isolation-tests
    command: npm run test:isolation

# No `apps:` — the harness always boots the workspace's Next dev server on 3000, which is what
# the nextjs MCP server attaches to and what the Evaluator drives with playwright.

specs: # basenames under specs/, delivered strictly in order
  - incident-desk-foundation.md
  - incident-desk-board.md
  - incident-desk-assignment.md
